<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1628" />
    <title>Offline · ShopWave</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a1628; color: #e6edf7; font-family: system-ui, sans-serif; text-align: center; padding: 1rem; }
      h1 { margin: 0 0 .5rem; }
      p { color: #9fb0c7; max-width: 28rem; margin: 0 auto 1.25rem; }
      button { background: #22d3ee; color: #0a1628; border: 0; border-radius: .5rem; padding: .75rem 1.5rem; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>We couldn't reach the network. Pages you've already visited and your cart are still available. Checkout and payment need a connection.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
